<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEDA</title>
<style>
:root{color-scheme:dark;
 --surface-0:#111110;--surface-1:#1a1a19;--surface-2:#232322;
 --text-primary:#fff;--text-secondary:#c3c2b7;--text-muted:#8b8a80;
 --accent:#3987e5;--rule:#33332f;--user-bubble:#2a3d54;}
:root[data-theme="light"]{color-scheme:light;
 --surface-0:#f4f4f1;--surface-1:#fcfcfb;--surface-2:#efefec;
 --text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#77766f;
 --accent:#2a78d6;--rule:#e0dfd9;--user-bubble:#dbe8fa;}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;
 --surface-0:#f4f4f1;--surface-1:#fcfcfb;--surface-2:#efefec;
 --text-primary:#0b0b0b;--text-secondary:#52514e;--text-muted:#77766f;
 --accent:#2a78d6;--rule:#e0dfd9;--user-bubble:#dbe8fa;}}
*{box-sizing:border-box}
body{margin:0;background:var(--surface-0);color:var(--text-primary);
 font:14px/1.5 ui-sans-serif,-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
 -webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;
 padding:14px 22px;border-bottom:1px solid var(--rule);flex:none}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
h1{font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0}
.sub{color:var(--text-muted);font-size:11.5px}
.ctl{display:flex;gap:8px;align-items:center}
select,button{background:var(--surface-1);border:1px solid var(--rule);color:var(--text-secondary);
 border-radius:7px;padding:6px 10px;font-size:12.5px;cursor:pointer;font-family:inherit}
.wrap{flex:1;overflow-y:auto;padding:22px;max-width:820px;width:100%;margin:0 auto}
.msg{margin-bottom:22px;display:flex;flex-direction:column;gap:6px}
.msg.user{align-items:flex-end}
.msg.user .bubble{background:var(--user-bubble);border-radius:14px 14px 3px 14px;
 padding:10px 14px;max-width:78%;white-space:pre-wrap}
.msg.neda .bubble{background:var(--surface-1);border:1px solid var(--rule);
 border-radius:14px 14px 14px 3px;padding:12px 15px;max-width:88%;white-space:pre-wrap}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--text-muted)}
.pill{background:var(--surface-2);border:1px solid var(--rule);border-radius:5px;
 padding:2px 7px;display:inline-flex;align-items:center;gap:4px}
.pill.tool{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--rule))}
.cursor{display:inline-block;width:7px;height:14px;background:var(--accent);
 vertical-align:text-bottom;animation:blink 1s step-end infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.thinking{display:inline-flex;gap:4px;align-items:center;padding:4px 0}
.thinking span{width:6px;height:6px;border-radius:50%;background:var(--text-muted);
 animation:bounce 1.2s ease-in-out infinite}
.thinking span:nth-child(2){animation-delay:.15s}
.thinking span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.status{color:var(--text-muted);font-size:11px;margin-left:6px}
.error-pill{background:#e5484d22;border:1px solid #e5484d88;color:#e5484d;border-radius:5px;
 padding:2px 7px;font-size:11px;display:inline-flex;align-items:center;gap:4px;margin-top:4px}
.attach-preview{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-1);
 border:1px solid var(--rule);border-radius:10px;margin-bottom:8px;max-width:820px;width:100%}
.attach-preview img{height:44px;border-radius:6px;border:1px solid var(--rule)}
.attach-preview .name{flex:1;font-size:12px;color:var(--text-secondary)}
.attach-preview button{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px}
.iconbtn{background:var(--surface-1);border:1px solid var(--rule);border-radius:10px;
 color:var(--text-secondary);cursor:pointer;padding:0 13px;font-size:16px;align-self:stretch}
.hint{color:var(--text-muted);font-size:10.5px;margin-left:4px}
.empty{color:var(--text-muted);text-align:center;padding:60px 20px;font-size:13px}
footer{flex:none;border-top:1px solid var(--rule);padding:14px 22px;
 display:flex;justify-content:center}
.inputbar{display:flex;gap:10px;max-width:820px;width:100%;align-items:flex-end;
 border-radius:12px;transition:outline-color .15s}
.inputbar.drag-active{outline:2px dashed var(--accent);outline-offset:4px}
textarea{flex:1;resize:none;background:var(--surface-1);border:1px solid var(--rule);
 border-radius:10px;color:var(--text-primary);padding:11px 13px;font:inherit;
 font-size:13.5px;max-height:140px}
textarea:focus{outline:none;border-color:var(--accent)}
button.send{background:var(--accent);color:#fff;border:none;border-radius:10px;
 padding:11px 18px;font-size:13px;font-weight:600}
button.send:disabled{opacity:.5;cursor:default}
</style></head><body>
<header>
 <div class="brand"><span class="dot"></span>
  <div><h1>NEDA</h1><div class="sub">local · read-only · Ollama + your own docs</div></div>
 </div>
 <div class="ctl">
  <select id="model">
   <option value="coder">Coder (qwen2.5-coder:32b)</option>
   <option value="reasoner">Reasoner (deepseek-r1:32b)</option>
  </select>
  <span class="hint" id="visionHint" style="display:none">🖼 image attached — using Vision model</span>
  <button id="tg">theme</button>
 </div>
</header>
<div class="wrap" id="wrap">
 <div class="empty" id="empty">Ask about BMC Helix / HPM or your Pine Script strategies.<br>Read-only — nothing here can change anything.</div>
</div>
<footer style="flex-direction:column;align-items:center">
 <div class="attach-preview" id="attachPreview" style="display:none">
  <img id="attachImg"><span class="name">screenshot attached</span>
  <button id="attachRemove" title="remove">✕</button>
 </div>
 <div class="inputbar">
  <button class="iconbtn" id="attachBtn" title="Attach a screenshot">📎</button>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
  <textarea id="input" rows="1" placeholder="Ask NEDA… (paste ⌘V or drag & drop a screenshot/file)"></textarea>
  <button class="send" id="send">Send</button><button class="iconbtn" id="stop" onclick="stopCurrentRequest()" style="display: none;">Stop</button><button class="iconbtn" id="clearChat" onclick="clearChatHistoryAndCache()">Clear</button>
<script>
function clearChatHistoryAndCache() {
  document.getElementById('wrap').innerHTML = '';
  localStorage.removeItem('nedaTheme');
}
</script>
 </div>
</footer>
<script>
const R=document.documentElement, K='nedaTheme';
if(localStorage.getItem(K))R.setAttribute('data-theme',localStorage.getItem(K));
tg.onclick=()=>{const c=R.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
 const n=c==='dark'?'light':'dark';R.setAttribute('data-theme',n);localStorage.setItem(K,n);};

const wrap=document.getElementById('wrap'), empty=document.getElementById('empty');
const input=document.getElementById('input'), sendBtn=document.getElementById('send');
const modelSel=document.getElementById('model'), visionHint=document.getElementById('visionHint');
const attachBtn=document.getElementById('attachBtn'), fileInput=document.getElementById('fileInput');
const attachPreview=document.getElementById('attachPreview'), attachImg=document.getElementById('attachImg');
const attachRemove=document.getElementById('attachRemove');
let busy=false, pendingImage=null; // pendingImage: base64 (no data: prefix)

input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(140,input.scrollHeight)+'px';});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
sendBtn.onclick=send;

attachBtn.onclick=()=>fileInput.click();
fileInput.onchange=()=>{ if(fileInput.files[0]) setImage(fileInput.files[0]); };
attachRemove.onclick=()=>clearImage();
document.addEventListener('paste',e=>{
 for(const item of e.clipboardData.items){
  if(item.type.startsWith('image/')){ setImage(item.getAsFile()); e.preventDefault(); break; }
 }
});

// Drag and drop, same targets/effects as the existing attach button + paste
// handler above: images go into pendingImage (Vision path), any other file's
// text content gets inserted into the message body.
const inputbar=document.querySelector('.inputbar');
['dragenter','dragover'].forEach(evt=>inputbar.addEventListener(evt,e=>{
 e.preventDefault(); e.stopPropagation(); inputbar.classList.add('drag-active');
}));
['dragleave','dragend'].forEach(evt=>inputbar.addEventListener(evt,e=>{
 e.preventDefault(); e.stopPropagation(); inputbar.classList.remove('drag-active');
}));
inputbar.addEventListener('drop',e=>{
 e.preventDefault(); e.stopPropagation(); inputbar.classList.remove('drag-active');
 const file=e.dataTransfer.files && e.dataTransfer.files[0];
 if(!file) return;
 if(file.type.startsWith('image/')){ setImage(file); return; }
 const reader=new FileReader();
 reader.onload=()=>{
  input.value+=(input.value?'\n\n':'')+`--- ${file.name} ---\n${reader.result}`;
  input.dispatchEvent(new Event('input'));
 };
 reader.readAsText(file);
});

function setImage(file){
 const reader=new FileReader();
 reader.onload=()=>{
  const dataUrl=reader.result;
  pendingImage=dataUrl.split(',')[1];
  attachImg.src=dataUrl;
  attachPreview.style.display='flex';
  modelSel.style.display='none'; visionHint.style.display='inline';
 };
 reader.readAsDataURL(file);
}
function clearImage(){
 pendingImage=null; attachPreview.style.display='none'; fileInput.value='';
 modelSel.style.display='inline-block'; visionHint.style.display='none';
}

function addUserMsg(text, imgDataUrl){
 empty.style.display='none';
 const m=document.createElement('div'); m.className='msg user';
 const bubble=document.createElement('div'); bubble.className='bubble';
 if(imgDataUrl){ const img=document.createElement('img'); img.src=imgDataUrl;
  img.style.cssText='max-width:260px;border-radius:8px;display:block;margin-bottom:6px'; bubble.appendChild(img); }
 const span=document.createElement('span'); span.textContent=text; bubble.appendChild(span);
 m.appendChild(bubble); wrap.appendChild(m); wrap.scrollTop=wrap.scrollHeight;
}

function addNedaMsg(){
 const m=document.createElement('div'); m.className='msg neda';
 m.innerHTML=`<div class="meta"></div><div class="bubble"><span class="thinking"><span></span><span></span><span></span></span><span class="status"></span><span class="text"></span><span class="cursor" style="display:none"></span></div>`;
 wrap.appendChild(m); wrap.scrollTop=wrap.scrollHeight;
 return m;
}

let currentController = null;
let currentRequestId = null;
let stopRequested = false;

async function stopCurrentRequest(){
 if(!currentRequestId) return;

 stopRequested = true;

 const id=currentRequestId;

 try{
  await fetch(`/cancel/${encodeURIComponent(id)}`, {method:'POST'});
 }catch(e){
  // Server may already have closed the connection.
 }

 if(currentController){
  currentController.abort();
 }
}

async function send(){
 const q=input.value.trim();
 if((!q&&!pendingImage)||busy) return;
 busy=true; sendBtn.disabled=true; document.getElementById('stop').style.display='inline-block';
 const imgDataUrl=pendingImage?attachImg.src:null;
 const imgToSend=pendingImage;
 addUserMsg(q||'(screenshot)', imgDataUrl);
 input.value=''; input.style.height='auto'; clearImage();

 const msgEl=addNedaMsg();
 const meta=msgEl.querySelector('.meta'), textEl=msgEl.querySelector('.text');
 const cursor=msgEl.querySelector('.cursor'), thinking=msgEl.querySelector('.thinking');
 const statusEl=msgEl.querySelector('.status');

 // Visible state so a slow-but-alive response and a genuinely dead one don't
 // look the same (both used to render as static dots forever — 2026-08-14).
 const startedAt=Date.now();
 let lastEventAt=Date.now();
 const STUCK_AFTER_MS=260000; // must stay ABOVE server.py's ollama.chat() timeout
                               // (240s as of 2026-08-14, bumped from 120s — a round
                               // right after a large tool result like read_self_file
                               // legitimately needs more room), or the browser gives
                               // up and shows a generic message before the server's
                               // own timeout can fire and explain what actually
                               // happened
 const controller=new AbortController();
 const requestId=crypto.randomUUID();
 stopRequested=false;
 currentRequestId=requestId;
 currentController=controller; // exposes THIS controller (the one actually
                                // wired to the fetch signal below) to the
                                // Stop button's click handler — an earlier
                                // patch created a second, separate
                                // AbortController that was never attached to
                                // the fetch call, so Stop silently did
                                // nothing; fixed by reusing this one instead.
 const statusTimer=setInterval(()=>{
  const s=Math.round((Date.now()-startedAt)/1000);
  statusEl.textContent=`· ${s}s`;
  if(Date.now()-lastEventAt>STUCK_AFTER_MS) controller.abort();
 },1000);

 function showError(msg){
  thinking.remove(); cursor.remove();
  const p=document.createElement('div'); p.className='error-pill';
  p.textContent=`⚠ ${msg}`;
  msgEl.querySelector('.bubble').appendChild(p);
 }

 try{
  const resp=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({question:q, model:modelSel.value, image:imgToSend, request_id:requestId}), signal:controller.signal});
  if(!resp.ok) throw new Error(`server returned ${resp.status}`);
  const reader=resp.body.getReader(); const decoder=new TextDecoder(); let buf='';

  while(true){
   const {done,value}=await reader.read();
   if(done) break;
   lastEventAt=Date.now();
   buf+=decoder.decode(value,{stream:true});
   const events=buf.split('\n\n'); buf=events.pop();
   for(const ev of events){
    const lines=ev.split('\n'); let event='',data='';
    for(const l of lines){ if(l.startsWith('event: '))event=l.slice(7); if(l.startsWith('data: '))data=l.slice(6); }
    if(!event) continue;
    const payload=JSON.parse(data);
    if(event==='thinking'){
     thinking.style.display='inline-flex';
    } else if(event==='thinking_done'){
     thinking.style.display='none'; cursor.style.display='inline-block';
    } else if(event==='retrieval' && payload.sources.length){
     for(const s of payload.sources){ const p=document.createElement('span'); p.className='pill'; p.textContent=s; meta.appendChild(p); }
    } else if(event==='tool_call'){
     const p=document.createElement('span'); p.className='pill tool';
     p.textContent=`⚙ ${payload.name}(${Object.values(payload.args).join(', ')})`;
     meta.appendChild(p);
    } else if(event==='token'){
     thinking.style.display='none'; cursor.style.display='inline-block';
     textEl.textContent+=payload.text; wrap.scrollTop=wrap.scrollHeight;
    } else if(event==='done'){
     cursor.remove(); thinking.remove(); statusEl.remove();
    } else if(event==='error'){
     showError(payload.text);
    }
   }
  }
 }catch(err){
  if(stopRequested && err.name==='AbortError'){
   thinking.remove();
   cursor.remove();
   statusEl.textContent='· stopped';
  }else{
   const reason=err.name==='AbortError'
    ? `no response for ${Math.round(STUCK_AFTER_MS/1000)}s — the server may have restarted or hung. Try again.`
    : `connection lost (${err.message}). Try again.`;
   showError(reason);
  }
 }finally{
  clearInterval(statusTimer);
  busy=false; sendBtn.disabled=false; document.getElementById('stop').style.display='none'; input.focus();
  currentController=null;
  currentRequestId=null;
 }
}
</script>
</body></html>
